<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<h1>Interactive Photo Gallery</h1>

<div id="image">
    Hover over an image below to display here.
</div>

<div class="gallery">
    <img src="img/img1.jpg" alt="Mountain"
        onmouseover="upDate(this)"
        onmouseout="undo()">

    <img src="img/img2.jpg" alt="Forest"
        onmouseover="upDate(this)"
        onmouseout="undo()">

    <img src="img/img3.jpg" alt="Sea"
        onmouseover="upDate(this)"
        onmouseout="undo()">

    <img src="img/img4.jpg" alt="Desert"
        onmouseover="upDate(this)"
        onmouseout="undo()">

    <img src="img/img5.jpg" alt="City"
        onmouseover="upDate(this)"
        onmouseout="undo()">

    <img src="img/img6.jpg" alt="Lake"
        onmouseover="upDate(this)"
        onmouseout="undo()">
</div>

<script src="js/script.js"></script>
</body>
</html>
